[project]
name = "worksheet"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["python-hwpx[preview]>=6.4,<7", "python-docx>=1.2,<2"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worksheet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "hancom: 한글 GUI를 띄우는 실한컴 렌더 검사 (-m hancom 으로만 실행)",
    "libreoffice: LibreOffice 헤드리스로 docx를 렌더하는 검사 (-m libreoffice 로만 실행)",
    "gdocs: 구글 드라이브를 오가는 구글 문서 왕복 렌더 검사 (-m gdocs 로만 실행)",
]
addopts = "-m 'not hancom and not libreoffice and not gdocs'"
