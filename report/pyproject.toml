[project]
name = "report"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
# design.marked(자리표시 견본 수확)는 python-hwpx-automation 7.4.0부터 공개 모듈이다.
dependencies = ["python-hwpx>=6.8,<7", "python-hwpx-automation>=7.4,<8"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["report_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "hancom: 한글 GUI를 띄우는 실한컴 렌더 검사 (-m hancom 으로만 실행)",
]
addopts = "-m 'not hancom'"
